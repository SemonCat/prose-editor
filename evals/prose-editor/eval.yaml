name: prose-editor-eval
description: reviewed trigger, truth, authority, and voice-preservation tests for prose editing.
skill: prose-editor
version: "1.1"
config:
  skill_directories:
    - ../..
  required_skills:
    - prose-editor
  trials_per_task: 1
  timeout_seconds: 180
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4-mini
metrics:
  - name: truth_preservation
    weight: 0.5
    threshold: 0.8
    description: Did the response preserve supplied facts and authority boundaries without invented humanizing details?
  - name: voice_restoration
    weight: 0.3
    threshold: 0.8
    description: Did the response preserve declared voice and specific anchors instead of applying a generic humanizer voice?
  - name: routing
    weight: 0.2
    threshold: 0.8
    description: Did the skill trigger for rewrite, humanize, de-AI, diagnose, or prose-polish requests while excluding adjacent neutral formatting/documentation requests?
tasks:
  - "tasks/*.yaml"
